name: Windows

# Produces the packages the operators actually install, so a release does not
# depend on one developer's machine being set up correctly.
on:
  push:
    branches: [master, 'resilience/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    env:
      QT_VERSION: 5.15.2
      BUILD_TYPE: Release

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: qtsvg
          cache: true

      # Only the small libraries. Qt comes prebuilt above, which keeps the job
      # to a few minutes instead of rebuilding Qt from source every time.
      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install --triplet x64-windows `
            tiff libjpeg-turbo libpng zlib `
            boost-test boost-multi-index boost-lambda boost-foreach `
            boost-intrusive boost-iterator boost-mpl boost-smart-ptr `
            boost-array boost-function boost-bind

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBoost_USE_STATIC_LIBS=OFF `
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        working-directory: build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Package
        working-directory: build
        run: |
          cpack -G ZIP -C ${{ env.BUILD_TYPE }}
          cpack -G ZIP -C ${{ env.BUILD_TYPE }} `
            -D CPACK_COMPONENTS_ALL=symbols `
            -D CPACK_ARCHIVE_COMPONENT_INSTALL=ON `
            -D CPACK_PACKAGE_FILE_NAME=scantailor-advanced-symbols

      # A package that starts and then dies before showing a window is the exact
      # failure this repository already shipped once: the build tree ran fine
      # because the package manager had deployed the transitive DLLs next to the
      # binary, while the package itself was missing fourteen of them. Unpacking
      # and launching the real artifact is the only check that catches it.
      - name: Smoke test the package
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/scantailor-advanced-*-win64.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath smoke
          $dir = (Get-ChildItem smoke -Directory | Select-Object -First 1).FullName
          $p = Start-Process -FilePath "$dir/scantailor.exe" -WorkingDirectory $dir -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "scantailor.exe exited with $($p.ExitCode)" }
          $p.Refresh()
          $mb = [math]::Round($p.WorkingSet64 / 1MB, 1)
          Write-Host "running: $mb MB, title '$($p.MainWindowTitle)'"
          # A process stuck on a missing DLL sits at a few MB with no window.
          if ($mb -lt 20) { throw "started but never initialised ($mb MB) - probably a missing dependency" }
          if (-not $p.MainWindowTitle) { throw "no main window appeared" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: scantailor-advanced-win64
          path: build/scantailor-advanced-*-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: scantailor-advanced-win64-symbols
          path: build/scantailor-advanced-symbols*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/scantailor-advanced-*.zip
